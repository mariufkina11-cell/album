<title>Галерея</title>

<style>

@font-face {
  font-family: 'Benzin';
  src: url('fonts/Benzin-Bold.otf') format('opentype');
}

body{
  background: linear-gradient(to bottom, #e6b3c8, #e98fb4);
  margin:0;
  padding:20px;
  font-family:'Benzin', sans-serif;
}

h1{
  color:white;
  text-align:center;
  margin-bottom:30px;
}

.gallery{
  display:grid;

  grid-template-columns:
  repeat(auto-fit, minmax(160px,1fr));

  gap:15px;
}

.gallery img{

  width:100%;
  aspect-ratio:1/1;

  object-fit:cover;

  border-radius:12px;

  transition:0.2s;
}

.gallery img:hover{
  transform:scale(1.04);
}

</style>
</head>
